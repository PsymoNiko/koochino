services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ApiBaseUrl: http://api:8081/
      AllowedHosts: "${ALLOWED_HOSTS:-localhost;127.0.0.1;web;api;koochino.shop;www.koochino.shop;api.koochino.shop}"
      ConnectionStrings__DefaultConnection: "${WEB_CONNECTION_STRING:?Set WEB_CONNECTION_STRING in .env}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Jwt__Issuer: "${JWT_ISSUER:?Set JWT_ISSUER in .env}"
      Jwt__Audience: "${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - web-uploads:/app/wwwroot/uploads
      - web-config:/app/modulesettings.json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
      AllowedHosts: "${ALLOWED_HOSTS:-localhost;127.0.0.1;web;api;koochino.shop;www.koochino.shop;api.koochino.shop}"
      ConnectionStrings__Default: "${API_CONNECTION_STRING:?Set API_CONNECTION_STRING in .env}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Jwt__Issuer: "${JWT_ISSUER:?Set JWT_ISSUER in .env}"
      Jwt__Audience: "${JWT_AUDIENCE:?Set JWT_AUDIENCE in .env}"
    ports:
      - "${API_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  web-uploads:
  web-config:
