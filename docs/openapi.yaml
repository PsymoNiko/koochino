openapi: 3.0.3
info:
  title: Koochino (MyShop) API
  version: 1.0.0
  description: |
    REST API of the MyShop.Api project (served at https://api.koochino.shop, compose port 8081).

    - Authentication: JWT Bearer tokens issued by POST /api/Auth/login (HS256, 60-minute expiry).
    - Authorization: most admin endpoints require role Admin plus a fine-grained permission
      (shown as x-required-permission on each operation, enforced by the permission engine).
    - Rate limiting: /api/Auth/* endpoints are limited by the "api-auth" policy plus a custom
      middleware (20 requests/min; lookup endpoints 8 requests/min).
    - Multi-tenancy: tenant (site) is resolved from the Host header; SiteId scoping applies
      to tenant-aware resources.
    - This document was hand-generated from the controller and DTO source code (main branch,
      2026-10). DTO field lists mirror MyShop.Core.Models exactly; a few module-license and
      holding schemas are free-form because their DTOs are not exposed in the repo docs yet.
servers:
  - url: https://api.koochino.shop
    description: Production
  - url: http://api.koochino.shop
    description: Development
  - url: http://localhost:8081
    description: Local (compose)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: User
  - name: Companies
  - name: Holdings
  - name: Contracts
  - name: CRM
  - name: Personnel
  - name: Tickets
  - name: Warehouses
  - name: Module Licenses
paths:
  /api/Auth/login:
    post:
      tags: [Auth]
      summary: Login with phone + password + requested role
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login (JWT token returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request body
        '401':
          description: Wrong credentials or inactive account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '429':
          description: Rate limit exceeded
  /api/Auth/find/{phone}:
    get:
      tags: [Auth]
      summary: Check whether a phone number is registered (existence + role only, no PII)
      operationId: findUserByPhone
      security: []
      parameters:
        - name: phone
          in: path
          required: true
          schema:
            type: string
          example: "09123456789"
      responses:
        '200':
          description: User exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLookupResponse'
        '404':
          description: No user with this phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLookupResponse'
        '429':
          description: Rate limit exceeded (8/min)
  /api/Auth/findrole:
    get:
      tags: [Auth]
      summary: Check whether a phone number is registered with a specific role
      operationId: findUserByPhoneAndRole
      security: []
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
        - name: roleId
          in: query
          required: true
          schema:
            type: integer
          description: "1=Admin, 2=StoreOwner, 3=Customer"
      responses:
        '200':
          description: User with this role exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLookupResponse'
        '404':
          description: No matching user
        '429':
          description: Rate limit exceeded
  /api/Auth/roles/{userId}:
    get:
      tags: [Auth]
      summary: Get role names of a user (self or admin with Users.View)
      operationId: getUserRoles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Role names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: Customer
        '401':
          description: Not authenticated
        '403':
          description: Neither the user nor an admin with Users.View
  /api/Auth/user/{userId}:
    get:
      tags: [Auth]
      summary: Get limited profile of a user (self or admin with Users.View)
      operationId: getAuthUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Limited profile (no password hash)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedUser'
        '401':
          description: Not authenticated
        '403':
          description: Neither the user nor an admin with Users.View
        '404':
          description: User not found
  /api/Auth/register:
    post:
      tags: [Auth]
      summary: Public registration (RoleId 2=StoreOwner or 3=Customer; 1 is forced to 3)
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResult'
        '400':
          description: Invalid request or registration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResult'
        '429':
          description: Rate limit exceeded
  /api/user/profile:
    get:
      tags: [User]
      summary: Get the authenticated user's own profile
      operationId: getMyProfile
      responses:
        '200':
          description: Profile of the JWT subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileVm'
        '401':
          description: Missing/invalid UserId claim
        '404':
          description: Profile not found
    post:
      tags: [User]
      summary: Update the authenticated user's own profile
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileDto'
      responses:
        '200':
          description: Updated
        '400':
          description: "Duplicate username / national code / email or update error"
        '401':
          description: Missing/invalid UserId claim
        '500':
          description: Server error
