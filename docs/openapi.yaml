      summary: Deactivate a module license for a site
      operationId: deactivateModuleLicense
      x-required-role: Admin
      x-required-permission: Users.Edit
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleKey
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseActionResult'
        '400':
          description: SiteId/moduleKey missing
        '403':
          description: Not allowed
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from POST /api/Auth/login (claims UserId, NameIdentifier, Role)
  schemas:
    LoginRequest:
      type: object
      required: [PhoneNumber, Password, RoleRequested]
      properties:
        PhoneNumber:
          type: string
          example: "09123456789"
        Password:
          type: string
          format: password
        RoleRequested:
          type: string
          example: Customer
          description: "Admin | StoreOwner | Customer"
    RegisterRequest:
      type: object
      required: [Username, PhoneNumber, FirstName, LastName, Password]
      properties:
        Username:
          type: string
          maxLength: 100
        PhoneNumber:
          type: string
          maxLength: 20
        Email:
          type: string
          maxLength: 256
          nullable: true
        FirstName:
          type: string
          maxLength: 100
        LastName:
          type: string
          maxLength: 100
        NationalCode:
          type: string
          maxLength: 10
          nullable: true
        Password:
          type: string
          minLength: 8
          maxLength: 100
          format: password
        RoleId:
          type: integer
          description: "1=Admin, 2=StoreOwner, 3=Customer; public registration only accepts 2 or 3 (others forced to 3)"
        InviteCode:
          type: string
          maxLength: 32
          nullable: true
        SiteId:
          type: integer
          nullable: true
          description: Server-set from Host header; client values are ignored
    LoginResponse:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type: string
          example: "ورود موفق"
        Token:
          type: string
          nullable: true
        Role:
          type: string
          nullable: true
        UserId:
          type: integer
        Username:
          type: string
          nullable: true
    RegisterResult:
      type: object
      properties:
