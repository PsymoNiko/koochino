        '404':
          description: Not found
    put:
      tags: [Companies]
      summary: Update a company
      operationId: updateCompany
      x-required-role: Admin
      x-required-permission: Companies.Edit
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyDto'
      responses:
        '204':
          description: Updated
        '400':
          description: Path id does not match body id
        '404':
          description: Not found
    delete:
      tags: [Companies]
      summary: Delete a company
      operationId: deleteCompany
      x-required-role: Admin
      x-required-permission: Companies.Delete
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '404':
